<!DOCTYPE html>
<html>
<head>
    <title>TypeSense - Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>TypeSense</h1>
    <p>Test and improve your typing speed</p>

    <div id="testArea">

        <p id="paragraph">
            The quick brown fox jumps over the lazy dog.
        </p>

        <textarea id="typingBox"
            placeholder="Start typing here..."></textarea>

        <div class="stats">
            <span>Time: <b id="timer">30</b>s</span>
            <span>WPM: <b id="wpm">0</b></span>
            <span>Accuracy: <b id="accuracy">100</b>%</span>
        </div>

        <button id="startButton">Start Test</button>
        <div id="resultBox" style="display:none;">
    <h2>🎉 Test Complete!</h2>
    <p>WPM: <b id="finalWpm">0</b></p>
    <p>Accuracy: <b id="finalAccuracy">0%</b></p>
    <p>Errors: <b id="finalErrors">0</b></p>
            <p>Weak Keys: <b id="weakKeys">None</b></p>
        </div>

    </div>
<script src="script.js?v=2"></script>
    
</body>
</html>
